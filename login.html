<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | JivanSetu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-green-50 to-emerald-50 min-h-screen flex items-center justify-center">

  <!-- Login Card -->
  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="flex justify-center mb-2">
        <div class="bg-red-500 p-3 rounded-full">
          <span class="text-white text-2xl">❤️</span>
        </div>
      </div>
      <h1 class="text-3xl font-bold text-gray-800">JivanSetu</h1>
      <p class="text-gray-500 text-sm">Bridge of Life</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-gray-700 font-medium mb-2">Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-green-400">
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-2">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-green-400">
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center space-x-2 text-gray-600">
          <input type="checkbox" id="remember" class="w-4 h-4 text-green-600">
          <span>Remember me</span>
        </label>
        <a href="#" class="text-green-600 hover:underline text-sm">Forgot password?</a>
      </div>

      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition-all transform hover:scale-105">
        🔐 Login
      </button>
    </form>

    <!-- Divider -->
    <div class="my-6 border-t border-gray-200"></div>

    <!-- Register -->
    <p class="text-center text-gray-600">
      Don’t have an account?
      <a href="register.html" class="text-green-600 hover:underline font-semibold">Register Now</a>
    </p>
  </div>

  <!-- Script -->
  <script>
    const loginForm = document.getElementById("loginForm");
    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // Simple login logic (for demo purpose)
      if (email === "admin@jivansetu.com" && password === "123456") {
        localStorage.setItem("user", email);
        alert("✅ Login successful!");
        window.location.href = "home.html";
      } else {
        alert("❌ Invalid email or password. Try again!");
      }
    });
  </script>
</body>
</html>
