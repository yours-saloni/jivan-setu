<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | JivanSetu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-green-50 to-emerald-50 min-h-screen">
  <!-- Header -->
  <div id="header"></div>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto mt-10 bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-3xl font-bold text-gray-800 mb-6">⚙️ Settings</h2>

    <!-- Profile Section -->
    <section class="mb-8">
      <h3 class="text-xl font-semibold text-gray-700 mb-4">Profile Information</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <input type="text" id="name" placeholder="Full Name" class="border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-green-400" />
        <input type="email" id="email" placeholder="Email Address" class="border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-green-400" />
        <input type="text" id="phone" placeholder="Phone Number" class="border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-green-400" />
        <input type="text" id="city" placeholder="City" class="border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-green-400" />
      </div>
    </section>

    <!-- Notification Preferences -->
    <section class="mb-8">
      <h3 class="text-xl font-semibold text-gray-700 mb-4">Notifications</h3>
      <div class="space-y-3">
        <label class="flex items-center space-x-2">
          <input type="checkbox" id="emailNotif" class="w-5 h-5 text-green-600" checked />
          <span>Email Notifications</span>
        </label>
        <label class="flex items-center space-x-2">
          <input type="checkbox" id="smsNotif" class="w-5 h-5 text-green-600" />
          <span>SMS Alerts</span>
        </label>
      </div>
    </section>

    <!-- Theme -->
    <section class="mb-8">
      <h3 class="text-xl font-semibold text-gray-700 mb-4">Appearance</h3>
      <div class="flex items-center justify-between">
        <span>Dark Mode</span>
        <button id="themeToggle" class="bg-gray-200 p-2 rounded-full transition hover:bg-gray-300">
          🌙
        </button>
      </div>
    </section>

    <!-- Change Password -->
    <section class="mb-8">
      <h3 class="text-xl font-semibold text-gray-700 mb-4">Change Password</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <input type="password" id="currentPassword" placeholder="Current Password" class="border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-green-400" />
        <input type="password" id="newPassword" placeholder="New Password" class="border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-green-400" />
      </div>
    </section>

    <!-- Save Button -->
    <div class="text-center">
      <button id="saveSettings" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-full font-semibold transition-all transform hover:scale-105">
        💾 Save Changes
      </button>
    </div>
  </main>

  <script>
    // Load header
    fetch("header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;
      });

    // Theme Toggle
    const themeToggle = document.getElementById("themeToggle");
    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("bg-gray-900");
      document.body.classList.toggle("text-white");
      if (document.body.classList.contains("bg-gray-900")) {
        themeToggle.textContent = "☀️";
      } else {
        themeToggle.textContent = "🌙";
      }
    });

    // Save Settings
    document.getElementById("saveSettings").addEventListener("click", () => {
      alert("✅ Settings saved successfully!");
    });
  </script>
</body>
</html>
